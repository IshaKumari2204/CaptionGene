# CaptionGene unified waste taxonomy (v1.0, Week 1)
#
# Every object gets four independent labels:
#   category        -> WHAT the object is (its form / function)
#   material        -> WHAT it is made of
#   condition       -> its physical state (multi-label, filled in Week 2-3 by VLM + human)
#   sorting_action  -> WHICH bin it should go to (default rule, region-dependent)
#
# Keeping these as separate fields lets us compose structured captions like
#   "<condition> <material> <category>"  ->  "crushed plastic bottle"

version: "1.0"

categories:
  bottle_jar:          "Bottles and jars (drink bottles, glass jars)"
  can:                 "Metal cans (drink cans, food tins, aerosol cans)"
  carton_box:          "Cartons and cardboard boxes (drink/egg/meal cartons, pizza & corrugated boxes)"
  cup:                 "Cups and drinking glasses (paper, plastic, foam, glass)"
  bag_wrapper:         "Bags, wrappers and films (carrier bags, crisp packets, plastic film, paper bags)"
  container_packaging: "Rigid containers and packaging (tubs, trays, takeaway boxes, blister packs, tubes)"
  cap_lid:             "Bottle caps and lids"
  paper:               "Loose paper items (sheets, magazines, tissues, toilet tubes)"
  straw_utensil:       "Straws and disposable cutlery"
  cigarette:           "Cigarette butts"
  food_waste:          "Food scraps / organic waste"
  glass_fragment:      "Broken glass pieces"
  hazardous:           "Hazardous items (batteries)"
  other_litter:        "Everything else (foil, pop tabs, rope, shoes, styrofoam, gloves, scrap metal, unlabeled)"
  unspecified:         "Object type not given by the source (ZeroWaste material-only labels) - to be filled in Week 2/3"

materials:
  plastic:          "Rigid or soft plastics, incl. foam (EPS)"
  metal:            "Aluminium, steel, tin"
  glass:            "Glass"
  paper_cardboard:  "Paper, cardboard, paperboard"
  organic:          "Food / biodegradable"
  composite:        "Multi-layer or mixed materials (Tetra Pak, crisp packets, blister packs, paper cups)"
  textile_rubber:   "Textile, leather, rubber, rope"
  e_waste:          "Batteries / electronics"
  unknown:          "Cannot be determined from the source label"

conditions:          # multi-label; empty list = not yet annotated
  - intact
  - crushed          # flattened / compressed
  - dented
  - crumpled         # paper / film
  - torn
  - broken           # shattered, snapped
  - open             # opened / unsealed / lid off
  - soiled           # food residue, dirt, stains
  - wet
  - burnt
  - faded            # weathered / sun-bleached
  - partially_occluded
  - heavily_occluded

sorting_actions:
  recycle_plastic:   "Plastic recycling bin"
  recycle_metal:     "Metal recycling bin"
  recycle_paper:     "Paper / cardboard recycling bin"
  recycle_glass:     "Glass recycling bin"
  compost:           "Organic / compost bin"
  landfill:          "General waste (non-recyclable)"
  hazardous_dropoff: "Special collection point (batteries, e-waste)"
  needs_review:      "Cannot be decided from the source label alone"

# Condition-dependent override rules (applied in Week 3 once conditions are known)
sorting_overrides:
  - if: {material: paper_cardboard, condition_has: soiled}
    then: landfill        # greasy pizza box, dirty paper
  - if: {category: glass_fragment}
    then: landfill        # broken glass is wrapped and binned, not recycled

scene_environments:
  - indoor_manmade
  - pavement_urban
  - sand_dirt_pebbles
  - vegetation
  - water
  - trash_pile
  - clean_background
  - conveyor_belt     # ZeroWaste: material recovery facility
  - household_tabletop # COCO-style everyday scenes
  - unknown

clutter_levels:       # derived from number of annotated objects
  single:   [1, 1]
  sparse:   [2, 3]
  moderate: [4, 9]
  dense:    [10, 100000]

# ---------------------------------------------------------------------------
